---
- name: Run setup tasks
  ansible.builtin.include_tasks: setup-{{ ansible_facts.os_family }}.yml

- name: Install Jellyfin
  ansible.builtin.package:
    name: "{{ jellyfin_package }}"
    state: "{{ jellyfin_package_state }}"
    version: "{{ jellyfin_package_version if jellyfin_package_version | length > 0 else omit }}"

- name: Ensure Jellyfin is running and enabled
  ansible.builtin.service:
    name: "{{ jellyfin_service_name }}"
    state: "{{ jellyfin_service_state }}"
    enabled: "{{ jellyfin_service_enabled }}"
