---
- name: Converge
  hosts: all

  pre_tasks:
    - name: Update apt cache.
      apt: update_cache=true cache_valid_time=600
      changed_when: false
      when: ansible_facts.os_family == 'Debian'

  roles:
    - role: carlosroman.jellyfin

  post_tasks:
    - name: Verify Jellyfin binary is available
      ansible.builtin.command: jellyfin --version
      register: jellyfin_version
      changed_when: false
      # jellyfin --version prints to stderr and exits non-zero.
      failed_when: "'Jellyfin' not in jellyfin_version.stdout + jellyfin_version.stderr"

    - name: Gather service facts
      ansible.builtin.service_facts:

    - name: Verify Jellyfin service is running and enabled
      ansible.builtin.assert:
        that:
          - ansible_facts.services['jellyfin.service'].state in ['active', 'running']
          - ansible_facts.services['jellyfin.service'].status in ['enabled', 'enabled-runtime', 'alias', 'static']
        fail_msg: "Jellyfin service is not running/enabled: {{ ansible_facts.services['jellyfin.service'] }}"

    # No hardware acceleration opt-in is set in this playbook, so the role must
    # leave Jellyfin's transcoding configuration alone. Jellyfin writes
    # encoding.xml itself a few seconds after the server first starts, so at
    # post-task time it is usually still absent and sometimes already the
    # application's own document; neither is evidence of the role's work. What
    # has to be absent is the role's rendering of it - the management comment -
    # and an acceleration type that only the role can put there.
    - name: Inspect the Jellyfin encoding configuration
      ansible.builtin.stat:
        path: /etc/jellyfin/encoding.xml
      register: jellyfin_encoding_stat

    - name: Read the Jellyfin encoding configuration
      ansible.builtin.slurp:
        src: /etc/jellyfin/encoding.xml
      register: jellyfin_encoding_contents
      when: jellyfin_encoding_stat.stat.exists

    - name: Verify the role left the encoding configuration to Jellyfin
      ansible.builtin.assert:
        that:
          - "'Managed by Ansible' not in encoding"
          - "encoding == '' or '<HardwareAccelerationType>none</HardwareAccelerationType>' in encoding"
        fail_msg: >-
          The role wrote encoding.xml although jellyfin_hardware_acceleration is
          unset: {{ encoding | default('', true) }}
      vars:
        encoding: "{{ (jellyfin_encoding_contents.content | default('', true) | b64decode) | trim }}"
